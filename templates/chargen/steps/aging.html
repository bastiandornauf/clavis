<p class="meta">
  {% include "chargen/rule_link.html" with cite=paths.aging label="Aging" %}
</p>
<div class="cg-fields">
  <label>
    Winters before 36
    <input class="chargen-live score-input" type="number" name="longevity_since" value="{% if state.longevity_since %}{{ state.longevity_since }}{% endif %}" min="1" max="35">
    <span class="meta">For a Longevity Ritual that started early. Empty starts at age 36.</span>
  </label>
</div>
<div id="aging-assign">
  {% include "chargen/aging_assign.html" %}
</div>
<div id="aging-board">
  {% include "chargen/aging_board.html" %}
</div>
<script>
  document.body.addEventListener("htmx:oobAfterSwap", function (event) {
    const board = document.getElementById("aging-board");
    if (!board || !event.target) return;
    if (event.target !== board && !board.contains(event.target)) return;
    const node = board.querySelector("#aging-dice-values");
    if (!node) return;
    const values = JSON.parse(node.textContent);
    for (const [id, value] of Object.entries(values)) {
      const field = document.getElementById(id);
      if (field && document.activeElement !== field) field.value = value;
    }
  });
</script>
