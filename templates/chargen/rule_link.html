{% if core_book and cite %}

      <path fill="none" stroke="currentColor" stroke-width="1.2" d="M3.5 12.7c0-.9.8-1.6 1.7-1.6H13"/>
      <path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" d="M6.2 6.2h4.2M6.2 8.4h4.2"/>

    {% if not quiet %}{{ label }}{% endif %}

{% elif not quiet %}

{% endif %}
