{% extends "base.html" %}

{% block content %}
  <h1 class="page-title">New campaign</h1>
  <form method="post" class="stack-form">
    {% csrf_token %}
    <label>
      Name
      <input type="text" name="name" required>
    </label>
    <label>
      Description
      <textarea name="description"></textarea>
    </label>
    <button type="submit">Create</button>
  </form>
{% endblock %}
